[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scanforge-backend"
version = "0.1.0"
description = "ScanForge 3D Reconstruction Platform Backend"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "ScanForge Team" }
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlmodel>=0.0.19",
    "redis>=5.0.4",
    "rq>=1.16.2",
    "sse-starlette>=2.1.0",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.1",
    "trimesh>=4.3.2",
    "numpy>=1.26.0,<2.0.0",
    "open3d>=0.18.0; platform_system != 'Darwin'",
    "scipy>=1.13.0",
    "pillow>=10.3.0",
    "opencv-python-headless>=4.9.0,<4.11.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
]
gpu = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "gsplat>=1.0.0",
    "nerfstudio>=1.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
