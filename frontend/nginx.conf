server {
    listen 80;
    server_name localhost;
    client_max_body_size 2048m;

    # Docker embedded DNS server for dynamic container IP re-resolution
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        set $api_backend http://api:8000;
        proxy_pass $api_backend;
        proxy_http_version 1.1;

        # Disable buffering for real-time SSE streaming and large file uploads
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;

        # Connection and timeouts for long-running jobs / SSE
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        chunked_transfer_encoding on;
        proxy_read_timeout 21600s;
        proxy_send_timeout 21600s;
    }
}
