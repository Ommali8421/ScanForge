services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - SCANFORGE_ENGINE=${SCANFORGE_ENGINE:-mock}
    volumes:
      - scanforge-data:/data
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker-mock:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python3 -m app.queue.worker --queue scanforge_mock
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - SCANFORGE_ENGINE=${SCANFORGE_ENGINE:-mock}
    volumes:
      - scanforge-data:/data
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - "mock"
    restart: unless-stopped

  worker-gpu:
    build:
      context: .
      dockerfile: docker/worker-gpu.Dockerfile
    image: scanforge-worker-gpu:latest
    command: python3 -m app.queue.worker --queue scanforge_gpu
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - SCANFORGE_ENGINE=${SCANFORGE_ENGINE:-real}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - scanforge-data:/data
      - ./backend:/workspace/backend
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - "gpu"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  test-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.test
    profiles:
      - "test"
    depends_on:
      - api

volumes:
  scanforge-data:
  redis-data:
